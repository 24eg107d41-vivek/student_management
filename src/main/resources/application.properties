# Server Port (Render passes dynamic PORT; defaults to 8080 locally)
server.port=${PORT:8080}
spring.application.name=student-management

# Datasource Configuration:
# Defaults to H2 in-memory (MySQL compatible) so deployment on Render works instantly out-of-the-box!
# If you set SPRING_DATASOURCE_URL in Render or locally, it will use that MySQL database instead.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:student_management;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.check-template-location=true
