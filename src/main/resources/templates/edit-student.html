<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container px-4">
            <a class="navbar-brand d-flex align-items-center" href="/students">
                <i class="bi bi-mortarboard-fill me-2 fs-3 text-warning"></i>
                <span>Student Management System</span>
            </a>
            <div>
                <a href="/students" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-arrow-left me-1"></i> Back to Directory
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="main-card p-4 shadow">
                    <div class="text-center mb-4">
                        <div class="stat-icon warning mx-auto mb-3">
                            <i class="bi bi-pencil-square"></i>
                        </div>
                        <h3 class="fw-bold">Edit Student Profile</h3>
                        <p class="text-muted small">Update student information for ID #<span th:text="${student.id}">1</span></p>
                    </div>

                    <form th:action="@{/students/update/{id}(id=${student.id})}" th:object="${student}" method="post">
                        <input type="hidden" th:field="*{id}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" th:field="*{phone}" class="form-control">
                        </div>
                        <div class="row">
                            <div class="col-md-7 mb-3">
                                <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <input type="text" th:field="*{department}" class="form-control" required>
                            </div>
                            <div class="col-md-5 mb-3">
                                <label class="form-label fw-semibold">Year of Study <span class="text-danger">*</span></label>
                                <select th:field="*{year}" class="form-select" required>
                                    <option value="1">Year 1 (Freshman)</option>
                                    <option value="2">Year 2 (Sophomore)</option>
                                    <option value="3">Year 3 (Junior)</option>
                                    <option value="4">Year 4 (Senior)</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <a href="/students" class="btn btn-light">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">
                                <i class="bi bi-check2-circle me-1"></i> Update Student
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
